[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "html-unembed-tool"
version = "0.2.0"
description = "Stream-extract base64 data: URIs from huge HTML dumps; optionally download external assets and rewrite links."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="liviuxyz-ctrl"}]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: HTML",
]

[project.urls]
Homepage = "https://github.com/liviuxyz-ctrl/Usable-Website-Downloader"
Repository = "https://github.com/liviuxyz-ctrl/Usable-Website-Downloader"

[project.scripts]
html-unembed = "html_unembed_tool.__main__:main"
